[program:commerce-maintenance]
command=/bin/sh /opt/opencardgate/commerce/run-maintenance.sh
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/opencardgate/commerce-maintenance.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=2
redirect_stderr=true
