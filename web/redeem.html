<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>MangoQWQ 资源兑换</title>
<link rel="icon" href="/brand/favicon.ico">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">

<link rel="stylesheet" href="/assets/redeem.css">
<script defer src="/assets/redeem.js"></script>
</head>
<body>
<main>
<div class="wrap">
  <div class="brand">
    <img src="/brand/logo.png" alt="MangoQWQ">
    <div>
      <div class="t1">MangoQWQ 资源站</div>
      <div class="t2">download.mangoqwq.com</div>
    </div>
  </div>
  <div class="theme-picker" role="group" aria-label="主题模式">
    <button type="button" data-theme-value="auto">自适应</button>
    <button type="button" data-theme-value="light">白天</button>
    <button type="button" data-theme-value="dark">夜晚</button>
  </div>
  <h1>资源兑换</h1>
  <p class="sub">输入您收到的卡号与密钥，即可获取资源下载链接。</p>
  <form id="redeem-form">
  <label for="card">卡号</label>
  <input id="card" inputmode="text" autocomplete="off" placeholder="请输入卡号" spellcheck="false">
  <label for="key">密钥</label>
  <input id="key" type="password" inputmode="text" autocomplete="off" placeholder="请输入密钥" spellcheck="false">
  <details class="legacy-resource">
    <summary>旧前缀卡：填写具体资源路径</summary>
    <label for="resource">资源路径（仅旧前缀卡需要）</label>
    <input id="resource" autocomplete="off" placeholder="例如 private/文件.zip" spellcheck="false">
  </details>
  <button id="go" type="submit">查看可用资源</button>
  </form>
  <div id="result" role="status" aria-live="polite"></div>
  <p class="hint">查看资源不扣次；签发下载授权后扣一次。<br>同一授权有效期内可重试下载，不重复扣次。<br>如兑换出现问题，请联系您的购买渠道获取帮助。</p>
</div>
</main>
<footer>
  <a href="https://github.com/dengyie/cardgw" target="_blank" rel="noopener">项目源码</a>
  <span class="sep">·</span>
  <span>&copy; MangoQWQ</span>
</footer>

</body>
</html>
