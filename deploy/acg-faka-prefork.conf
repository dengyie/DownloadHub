# acg-faka's dedicated Apache/PHP prefork pool on pxed.
# Install only as /srv/acg-rootfs/etc/apache2/mods-enabled/mpm_prefork.conf.
# Keep concurrency below MySQL's 32 connections, leaving room for administration
# and backups. Excess requests queue; measure latency before increasing workers.
StartServers            2
MinSpareServers         2
MaxSpareServers         3
MaxRequestWorkers       16
MaxConnectionsPerChild  0
