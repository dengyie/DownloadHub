# Dedicated Apache/PHP prefork pool example.
# Example path: /etc/apache2/mods-enabled/mpm_prefork.conf.
# Keep concurrency below database connections limit, leaving room for administration
# and backups. Excess requests queue; measure latency before increasing workers.
StartServers            2
MinSpareServers         2
MaxSpareServers         3
MaxRequestWorkers       16
MaxConnectionsPerChild  0
