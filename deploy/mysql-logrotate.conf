# Download MySQL only. Invoked every minute by download-logrotate (Supervisor).
# Keep the original incident archive outside this retention set.
/var/log/mysql/error.log {
    daily
    maxsize 32M
    rotate 7
    missingok
    notifempty
    create 0640 mysql adm
    su mysql adm
    compress
    compressoptions -1
    delaycompress
    dateext
    dateformat -%Y%m%dT%H%M%S
    postrotate
        /usr/bin/python3 /personal/pxed/cardgw-mysql-reopen-logs.py --pid-file /data/mysql-restored-20261001/bohrium-4468742-1483811.pid --datadir /data/mysql-restored-20261001
    endscript
}
