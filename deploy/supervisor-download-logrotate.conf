[program:download-logrotate]
command=/bin/sh /personal/pxed/cardgw-run-mysql-logrotate.sh
directory=/personal/pxed
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=20
stdout_logfile=/data/tuntunshu/runtime/download-logrotate.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
redirect_stderr=true
