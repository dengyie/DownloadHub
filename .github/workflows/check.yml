name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, pdo_sqlite, sqlite3, mbstring, curl, gd, zip, openssl
          coverage: none
      - run: npm --prefix frontend ci --ignore-scripts
      - name: Install nginx for isolated routing acceptance
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx-light
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make check
      - run: make build-linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-evidence
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
